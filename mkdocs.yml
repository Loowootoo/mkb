site_name: 我的知識庫
site_description: 個人知識庫與筆記
site_author: Couga

nav:
  - Astar + Static Arrsy: 'Astar + Static Arrsy.md'
  - 關於這個知識庫: 'about.md'
  - 入門範例: 'getting-started.md'
  - 歡迎來到我的知識庫: 'index.md'
  - 有限狀態機細節: '有限狀態機細節.md'
  - 生死: '生死.md'
  - 演算法筆記:
      - Memoization: 'Algorithm Design.md'
theme:
  name: material
  palette:
    - scheme: default
      primary: deep-purple
      accent: deep-purple
      toggle:
        icon: material/brightness-7
        name: 切換到淺色模式
    - scheme: slate
      primary: deep-purple
      accent: deep-purple
      toggle:
        icon: material/brightness-4
        name: 切換到深色模式
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - search.highlight
    - search.share
    - content.code.annotate
    - content.tabs.link
    - content.action.edit
    - content.action.view
    - content.footnote.tooltips
    - content.tooltips
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  font:
    text: Noto Sans TC
    code: Fira Code

plugins:
  - search
  - tags
  - git-revision-date-localized

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Couga
  generator: false
